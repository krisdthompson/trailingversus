{% load crispy_forms_tags %}

<div class="card mb-4">
    <div class="card-header">
        <h5 class="card-title mb-0">Verse Summary</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-8">
                <h6>Pattern</h6>
                <pre class="verse-pattern">{{ verse.pattern|default:"No pattern defined" }}</pre>
            </div>
            <div class="col-md-4">
                <h6>Lines</h6>
                <p class="mb-0">{{ verse.lines.count }}</p>
            </div>
        </div>
    </div>
</div>
