{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Trail Verses{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --texas-brown: #8B4513;
            --texas-sand: #DAA520;
            --texas-cedar: #6B4423;
            --texas-earth: #964B00;
            --texas-sky: #87CEEB;
        }

        body {
            background-color: var(--texas-sand);
            background-image: url('https://www.transparenttextures.com/patterns/leather.png');
        }

        .navbar {
            background-color: var(--texas-cedar) !important;
            border-bottom: 2px solid var(--texas-earth);
        }

        .navbar-brand {
            color: var(--texas-sand) !important;
            font-family: 'Georgia', serif;
            font-size: 1.5rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .nav-link {
            color: var(--texas-sand) !important;
            font-size: 1.1rem;
        }

        .nav-link:hover {
            color: white !important;
        }

        .nav-link.active {
            color: white !important;
            font-weight: bold;
        }

        .btn-close {
            filter: opacity(0.8);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--texas-sand);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--texas-cedar);
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--texas-brown);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'versus:list' %}">
                <i class="bi bi-journal-text"></i> Trail Verses
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'list' %}active{% endif %}" 
                           href="{% url 'versus:list' %}">
                            <i class="bi bi-collection"></i> Verses
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'create' %}active{% endif %}" 
                           href="{% url 'versus:create' %}">
                            <i class="bi bi-plus-circle"></i> New Verse
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
