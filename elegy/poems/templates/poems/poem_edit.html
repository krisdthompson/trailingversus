{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="mb-4 d-flex justify-content-between align-items-center">
                <h1>Edit Poem</h1>
                <a href="{% url 'poems:detail' poem.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </div>

            <form method="post" class="bg-white p-4 rounded shadow-sm">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ poem.title }}" required>
                </div>

                <div id="poem-lines" class="sortable-lines">
                    {% for line in poem.lines.all %}
                    <div class="poem-line mb-3 p-3 border rounded" data-position="{{ line.position }}">
                        <div class="row">
                            <div class="col">
                                <div class="mb-2 d-flex">
                                    <div class="drag-handle me-2 text-muted d-flex align-items-center" style="cursor: grab;">
                                        <i class="bi bi-grip-vertical fs-4"></i>
                                    </div>
                                    <div class="flex-grow-1">
                                        <label class="form-label">Line {{ line.position }}</label>
                                        <input type="text" class="form-control" name="line_{{ line.position }}" value="{{ line.content }}">
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="text-muted small d-flex align-items-center">
                                        <div class="me-2">
                                            Syllables: <span class="badge bg-secondary syllable-count">{{ line.syllable_count }}</span>
                                            <button type="button" class="btn btn-sm btn-link text-decoration-none recalculate-btn" title="Recalculate syllables">
                                                <i class="bi bi-arrow-clockwise"></i>
                                            </button>
                                            {% if line.is_syllable_override %}
                                            <span class="badge bg-info override-indicator" title="Syllable count is overridden">
                                                <i class="bi bi-pencil-fill"></i>
                                            </span>
                                            {% else %}
                                            <span class="badge bg-info override-indicator d-none" title="Syllable count is overridden">
                                                <i class="bi bi-pencil-fill"></i>
                                            </span>
                                            {% endif %}
                                        </div>
                                        <div class="syllable-override">
                                            <button type="button" class="btn btn-sm btn-outline-secondary override-btn">Override</button>
                                            <div class="override-input d-none">
                                                <input type="number" class="form-control form-control-sm d-inline-block" 
                                                       style="width: 80px;" name="syllables_{{ line.position }}" 
                                                       value="{{ line.syllable_count }}" min="1" max="99">
                                                <button type="button" class="btn btn-sm btn-outline-primary confirm-override">✓</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="form-label me-2">Grade (1-99):</label>
                                        <input type="number" class="form-control form-control-sm d-inline-block" 
                                               style="width: 80px;" name="grade_{{ line.position }}" 
                                               value="{{ line.grade }}" min="1" max="99" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-outline-success ms-2" id="add-line">Add Line</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
    .sortable-ghost {
        opacity: 0.4;
        background: #f8f9fa !important;
    }
    .sortable-drag {
        background: white !important;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    }
    .poem-line {
        transition: transform 0.15s ease-out;
    }
    .poem-line:hover .drag-handle {
        color: #0d6efd !important;
    }
    .drag-handle {
        cursor: grab;
        padding: 0.5rem;
        margin: -0.5rem;
    }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize Sortable first
    const poemLines = document.getElementById('poem-lines');
    if (poemLines) {
        new Sortable(poemLines, {
            handle: '.drag-handle',
            animation: 150,
            ghostClass: 'sortable-ghost',
            dragClass: 'sortable-drag',
            onStart: function(evt) {
                evt.item.classList.add('shadow');
                document.body.style.cursor = 'grabbing';
            },
            onEnd: function(evt) {
                evt.item.classList.remove('shadow');
                document.body.style.cursor = 'auto';
                
                // Update all position labels and input names
                document.querySelectorAll('.poem-line').forEach((line, index) => {
                    const position = index + 1;
                    line.dataset.position = position;
                    line.querySelector('.form-label').textContent = `Line ${position}`;
                    
                    // Update input names
                    const contentInput = line.querySelector('[name^="line_"]');
                    const gradeInput = line.querySelector('[name^="grade_"]');
                    const syllableInput = line.querySelector('[name^="syllables_"]');
                    
                    if (contentInput) contentInput.name = `line_${position}`;
                    if (gradeInput) gradeInput.name = `grade_${position}`;
                    if (syllableInput) syllableInput.name = `syllables_${position}`;
                });
            }
        });
    }

    // Add form submission handler
    document.querySelector('form').addEventListener('submit', function(e) {
        // Check if CSRF token is present
        const csrfToken = this.querySelector('[name="csrfmiddlewaretoken"]');
        if (!csrfToken) {
            console.error('CSRF token is missing from the form!');
            e.preventDefault();
            return;
        }
        
        // Update all line positions before submitting
        document.querySelectorAll('.poem-line').forEach((line, index) => {
            const position = index + 1;
            line.dataset.position = position;
            
            // Update input names
            const contentInput = line.querySelector('[name^="line_"]');
            const gradeInput = line.querySelector('[name^="grade_"]');
            const syllableInput = line.querySelector('[name^="syllables_"]');
            
            if (contentInput) contentInput.name = `line_${position}`;
            if (gradeInput) gradeInput.name = `grade_${position}`;
            if (syllableInput) syllableInput.name = `syllables_${position}`;
        });
        
        // Log form data being submitted
        const formData = new FormData(this);
        console.log('Submitting form with data:');
        for (let [key, value] of formData.entries()) {
            console.log(key + ': ' + value);
        }
    });

    function countSyllables(word) {
        if (!word) return 0;
        
        word = word.toLowerCase();
        let count = 0;
        const vowels = "aeiouy";
        
        // Count groups of vowels (including 'y')
        if (vowels.includes(word[0])) {
            count++;
        }
        for (let i = 1; i < word.length; i++) {
            if (vowels.includes(word[i]) && !vowels.includes(word[i - 1])) {
                count++;
            }
        }
        
        // Handle silent e
        if (word.endsWith('e')) {
            count--;
        }
        
        // Handle special cases
        if (word.endsWith('le') && word.length > 2 && !vowels.includes(word[word.length - 3])) {
            count++;
        }
        
        return Math.max(1, count);
    }

    function updateSyllableCount(input) {
        const words = input.value.trim().split(/\s+/);
        const totalSyllables = words.reduce((sum, word) => sum + countSyllables(word), 0);
        
        // Find the closest syllable count display
        const lineElement = input.closest('.poem-line');
        const syllableDisplay = lineElement.querySelector('.syllable-count');
        syllableDisplay.textContent = totalSyllables;
    }

    // Add input event listeners to existing lines
    document.querySelectorAll('[name^="line_"]').forEach(input => {
        input.addEventListener('input', () => updateSyllableCount(input));
    });

    // Handle syllable count override
    document.querySelectorAll('.override-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const overrideSection = btn.closest('.syllable-override');
            overrideSection.querySelector('.override-btn').classList.add('d-none');
            overrideSection.querySelector('.override-input').classList.remove('d-none');
        });
    });

    document.querySelectorAll('.confirm-override').forEach(btn => {
        btn.addEventListener('click', function() {
            const overrideSection = btn.closest('.syllable-override');
            const syllableInput = overrideSection.querySelector('input[type="number"]');
            const syllableDisplay = overrideSection.closest('.poem-line').querySelector('.syllable-count');
            
            syllableDisplay.textContent = syllableInput.value;
            overrideSection.querySelector('.override-btn').classList.remove('d-none');
            overrideSection.querySelector('.override-input').classList.add('d-none');
            
            // Show override indicator
            const overrideIndicator = overrideSection.closest('.poem-line').querySelector('.override-indicator');
            overrideIndicator.classList.remove('d-none');
        });
    });

    document.getElementById('add-line').addEventListener('click', function() {
        const linesContainer = document.getElementById('poem-lines');
        const currentLines = linesContainer.getElementsByClassName('poem-line').length;
        const newPosition = currentLines + 1;
        
        const newLine = document.createElement('div');
        newLine.className = 'poem-line mb-3 p-3 border rounded';
        newLine.dataset.position = newPosition;
        newLine.innerHTML = `
            <div class="row">
                <div class="col">
                    <div class="mb-2 d-flex">
                        <div class="drag-handle me-2 text-muted d-flex align-items-center" style="cursor: grab;">
                            <i class="bi bi-grip-vertical fs-4"></i>
                        </div>
                        <div class="flex-grow-1">
                            <label class="form-label">Line ${newPosition}</label>
                            <input type="text" class="form-control" name="line_${newPosition}">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="text-muted small d-flex align-items-center">
                            <div class="me-2">
                                Syllables: <span class="badge bg-secondary syllable-count">0</span>
                                <button type="button" class="btn btn-sm btn-link text-decoration-none recalculate-btn" title="Recalculate syllables">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </button>
                                <span class="badge bg-info override-indicator d-none" title="Syllable count is overridden">
                                    <i class="bi bi-pencil-fill"></i>
                                </span>
                            </div>
                            <div class="syllable-override">
                                <button type="button" class="btn btn-sm btn-outline-secondary override-btn">Override</button>
                                <div class="override-input d-none">
                                    <input type="number" class="form-control form-control-sm d-inline-block" 
                                           style="width: 80px;" name="syllables_${newPosition}" 
                                           value="0" min="1" max="99">
                                    <button type="button" class="btn btn-sm btn-outline-primary confirm-override">✓</button>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="form-label me-2">Grade (1-99):</label>
                            <input type="number" class="form-control form-control-sm d-inline-block" 
                                   style="width: 80px;" name="grade_${newPosition}" 
                                   value="50" min="1" max="99" required>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        linesContainer.appendChild(newLine);
        
        // Add input event listener to the new line
        const newInput = newLine.querySelector(`[name="line_${newPosition}"]`);
        newInput.addEventListener('input', () => updateSyllableCount(newInput));
        
        // Add override button listener
        const overrideBtn = newLine.querySelector('.override-btn');
        overrideBtn.addEventListener('click', function() {
            const overrideSection = overrideBtn.closest('.syllable-override');
            overrideSection.querySelector('.override-btn').classList.add('d-none');
            overrideSection.querySelector('.override-input').classList.remove('d-none');
        });
        
        // Add confirm override listener
        const confirmBtn = newLine.querySelector('.confirm-override');
        confirmBtn.addEventListener('click', function() {
            const overrideSection = confirmBtn.closest('.syllable-override');
            const syllableInput = overrideSection.querySelector('input[type="number"]');
            const syllableDisplay = overrideSection.closest('.poem-line').querySelector('.syllable-count');
            
            syllableDisplay.textContent = syllableInput.value;
            overrideSection.querySelector('.override-btn').classList.remove('d-none');
            overrideSection.querySelector('.override-input').classList.add('d-none');
            
            // Show override indicator
            const overrideIndicator = overrideSection.closest('.poem-line').querySelector('.override-indicator');
            overrideIndicator.classList.remove('d-none');
        });
    });

    document.querySelectorAll('.recount-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const lineElement = btn.closest('.poem-line');
            const contentInput = lineElement.querySelector('[name^="line_"]');
            const syllableDisplay = lineElement.querySelector('.syllable-count');
            const overrideInput = lineElement.querySelector('[name^="syllables_"]');
            
            // Recount syllables
            const words = contentInput.value.trim().split(/\s+/);
            const totalSyllables = words.reduce((sum, word) => sum + countSyllables(word), 0);
            
            // Update display and remove warning color
            syllableDisplay.textContent = totalSyllables;
            syllableDisplay.classList.remove('bg-warning');
            syllableDisplay.classList.add('bg-secondary');
            
            // Update override input value
            if (overrideInput) {
                overrideInput.value = totalSyllables;
            }
        });
    });

    // Add recalculate button handler
    document.querySelectorAll('.recalculate-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const lineElement = btn.closest('.poem-line');
            const contentInput = lineElement.querySelector('[name^="line_"]');
            const syllableDisplay = lineElement.querySelector('.syllable-count');
            const overrideInput = lineElement.querySelector('[name^="syllables_"]');
            const overrideIndicator = lineElement.querySelector('.override-indicator');
            
            // Recount syllables
            const words = contentInput.value.trim().split(/\s+/);
            const totalSyllables = words.reduce((sum, word) => sum + countSyllables(word), 0);
            
            // Update display
            syllableDisplay.textContent = totalSyllables;
            syllableDisplay.classList.remove('bg-warning');
            syllableDisplay.classList.add('bg-secondary');
            
            // Update override input value and hide override indicator
            if (overrideInput) {
                overrideInput.value = '';  // Clear the override value
                overrideInput.closest('.override-input').classList.add('d-none');
                overrideInput.closest('.syllable-override').querySelector('.override-btn').classList.remove('d-none');
            }
            overrideIndicator.classList.add('d-none');
        });
    });
});
</script>
{% endblock %}
